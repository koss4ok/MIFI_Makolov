name: lottery-project

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lottery
      POSTGRES_USER: lottery
      POSTGRES_PASSWORD: lottery
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lottery -d lottery"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/lottery
      DB_USER: lottery
      DB_PASSWORD: lottery
      DRAW_NUM_COUNT: 6
      DRAW_NUM_MIN: 1
      DRAW_NUM_MAX: 49
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      

volumes:
  postgres_data:
